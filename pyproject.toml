[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaldesk"
version = "0.1.0"
description = "Native signal pool, waveform workspace and configurable local controls"
requires-python = ">=3.11"
dependencies = ["PySide6==6.10.2", "pyqtgraph==0.14.0", "numpy==2.4.2"]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0", "pefile>=2024.8.26; sys_platform == 'win32'"]

[project.scripts]
signaldesk = "signaldesk.app:main"

[tool.setuptools.packages.find]
where = ["src"]
